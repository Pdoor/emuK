<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>emuK</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>emuK</h1>
          <p id="status">Connessione...</p>
          <p id="detail">Avvia il companion su Windows e resta sulla stessa rete Wi-Fi.</p>
        </div>
        <button class="icon-button" id="reconnect" type="button" title="Riconnetti">↻</button>
      </header>

      <section class="text-pad" aria-label="Invio testo">
        <textarea id="textInput" rows="3" placeholder="Scrivi qui e invia a Windows"></textarea>
        <div class="actions">
          <button type="button" data-send-text>Invia testo</button>
          <button type="button" data-test>Test</button>
          <button type="button" data-key="backspace">Backspace</button>
          <button type="button" data-key="enter">Enter</button>
        </div>
      </section>

      <section class="quick-grid" aria-label="Scorciatoie">
        <button type="button" data-combo="ctrl,c">Ctrl C</button>
        <button type="button" data-combo="ctrl,v">Ctrl V</button>
        <button type="button" data-combo="ctrl,x">Ctrl X</button>
        <button type="button" data-combo="ctrl,z">Ctrl Z</button>
        <button type="button" data-combo="ctrl,a">Ctrl A</button>
        <button type="button" data-combo="alt,tab">Alt Tab</button>
        <button type="button" data-combo="win,d">Win D</button>
        <button type="button" data-combo="ctrl,shift,escape">Task</button>
      </section>

      <section class="keyboard" aria-label="Tastiera">
        <div class="row compact">
          <button type="button" data-key="escape">Esc</button>
          <button type="button" data-key="f1">F1</button>
          <button type="button" data-key="f2">F2</button>
          <button type="button" data-key="f3">F3</button>
          <button type="button" data-key="f4">F4</button>
          <button type="button" data-key="f5">F5</button>
          <button type="button" data-key="f6">F6</button>
          <button type="button" data-key="f7">F7</button>
          <button type="button" data-key="f8">F8</button>
          <button type="button" data-key="f9">F9</button>
          <button type="button" data-key="f10">F10</button>
          <button type="button" data-key="f11">F11</button>
          <button type="button" data-key="f12">F12</button>
        </div>
        <div class="row">
          <button type="button" data-text="1">1</button>
          <button type="button" data-text="2">2</button>
          <button type="button" data-text="3">3</button>
          <button type="button" data-text="4">4</button>
          <button type="button" data-text="5">5</button>
          <button type="button" data-text="6">6</button>
          <button type="button" data-text="7">7</button>
          <button type="button" data-text="8">8</button>
          <button type="button" data-text="9">9</button>
          <button type="button" data-text="0">0</button>
        </div>
        <div class="row">
          <button type="button" data-text="q">Q</button>
          <button type="button" data-text="w">W</button>
          <button type="button" data-text="e">E</button>
          <button type="button" data-text="r">R</button>
          <button type="button" data-text="t">T</button>
          <button type="button" data-text="y">Y</button>
          <button type="button" data-text="u">U</button>
          <button type="button" data-text="i">I</button>
          <button type="button" data-text="o">O</button>
          <button type="button" data-text="p">P</button>
        </div>
        <div class="row offset">
          <button type="button" data-text="a">A</button>
          <button type="button" data-text="s">S</button>
          <button type="button" data-text="d">D</button>
          <button type="button" data-text="f">F</button>
          <button type="button" data-text="g">G</button>
          <button type="button" data-text="h">H</button>
          <button type="button" data-text="j">J</button>
          <button type="button" data-text="k">K</button>
          <button type="button" data-text="l">L</button>
        </div>
        <div class="row offset-large">
          <button type="button" data-key="shift">Shift</button>
          <button type="button" data-text="z">Z</button>
          <button type="button" data-text="x">X</button>
          <button type="button" data-text="c">C</button>
          <button type="button" data-text="v">V</button>
          <button type="button" data-text="b">B</button>
          <button type="button" data-text="n">N</button>
          <button type="button" data-text="m">M</button>
          <button type="button" data-key="delete">Del</button>
        </div>
        <div class="row">
          <button type="button" data-key="ctrl">Ctrl</button>
          <button type="button" data-key="win">Win</button>
          <button type="button" data-key="alt">Alt</button>
          <button class="space" type="button" data-text=" ">Space</button>
          <button type="button" data-key="left">←</button>
          <button type="button" data-key="up">↑</button>
          <button type="button" data-key="down">↓</button>
          <button type="button" data-key="right">→</button>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
